    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;

  const parse = JSON.parse;

  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

      throw new Error(`Missing ${property} getter`);

    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };

    }

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

        return value;

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },

    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);

                } else {

        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

      element = event.target.parentElement;

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

  syncTheme();

&lt;div id=&quot;apostille-document-guide&quot;&gt;
  &lt;header class=&quot;gov-top&quot;&gt;&lt;div class=&quot;gov-brand&quot;&gt;gov.il | מידע ושירותים ממשלתיים&lt;/div&gt;&lt;div class=&quot;gov-actions&quot;&gt;&lt;span&gt;חיפוש&lt;/span&gt;&lt;span&gt;עברית&lt;/span&gt;&lt;span&gt;אזור אישי&lt;/span&gt;&lt;/div&gt;&lt;/header&gt;
  &lt;section class=&quot;gov-hero&quot;&gt;&lt;h1&gt;אימות מסמך ישראלי לשימוש בחו״ל&lt;/h1&gt;&lt;p&gt;כל המידע על אימות מסמכים ישראליים לצורך הצגתם בחו״ל.&lt;/p&gt;&lt;/section&gt;
  &lt;div class=&quot;gov-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;נושאים בדף&quot;&gt;
    &lt;button class=&quot;gov-tab&quot; id=&quot;tab-start&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;panel-start&quot; aria-selected=&quot;true&quot;&gt;&lt;span class=&quot;gov-icon&quot;&gt;&lt;i data-lucide=&quot;file-check-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;יש לי מסמך ישראלי שעלי להציג בחו״ל&lt;/span&gt;&lt;/button&gt;
    &lt;button class=&quot;gov-tab&quot; id=&quot;tab-requirements&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;panel-requirements&quot; aria-selected=&quot;false&quot;&gt;&lt;span class=&quot;gov-icon&quot;&gt;&lt;i data-lucide=&quot;clipboard-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;לפני שמתחילים&lt;/span&gt;&lt;/button&gt;
    &lt;button class=&quot;gov-tab&quot; id=&quot;tab-destination&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;panel-destination&quot; aria-selected=&quot;false&quot;&gt;&lt;span class=&quot;gov-icon&quot;&gt;&lt;i data-lucide=&quot;globe-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;לאיזו מדינה המסמך מיועד?&lt;/span&gt;&lt;/button&gt;
    &lt;button class=&quot;gov-tab&quot; id=&quot;tab-documents&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;panel-documents&quot; aria-selected=&quot;false&quot;&gt;&lt;span class=&quot;gov-icon&quot;&gt;&lt;i data-lucide=&quot;files&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;איזה מסמך צריך לאמת?&lt;/span&gt;&lt;/button&gt;
  &lt;/div&gt;

  &lt;section class=&quot;gov-panel&quot; id=&quot;panel-start&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-start&quot;&gt;
    &lt;h2&gt;יש לי מסמך ישראלי שעלי להציג בחו״ל.&lt;/h2&gt;
    &lt;p&gt;צריכים להציג מסמך ישראלי בחו״ל? ייתכן שתצטרכו לאמת אותו לפני ההגשה. בעמוד זה תוכלו להבין איזה אימות נדרש, כיצד להכין את המסמך והיכן לבצע את האימות.&lt;/p&gt;
    &lt;div class=&quot;notice&quot;&gt;&lt;h3&gt;מהו אפוסטיל?&lt;/h3&gt;&lt;p&gt;אפוסטיל הוא אישור המאמת שהמסמך נחתם או הונפק בידי גורם מוסמך. הוא אינו מאשר את תוכן המסמך עצמו.&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;gov-panel&quot; id=&quot;panel-requirements&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-requirements&quot; hidden&gt;
    &lt;h2&gt;לפני שמתחילים – בדקו מה דורש הגוף המקבל&lt;/h2&gt;
    &lt;p&gt;לפני ביצוע האימות, בדקו עם הגוף שאליו תגישו את המסמך:&lt;/p&gt;
    &lt;ul class=&quot;steps&quot;&gt;&lt;li&gt;האם נדרש אפוסטיל או אימות אחר?&lt;/li&gt;&lt;li&gt;האם מתקבלים מסמך ואפוסטיל דיגיטליים?&lt;/li&gt;&lt;li&gt;האם נדרש תרגום?&lt;/li&gt;&lt;li&gt;האם יש לאמת גם את מסמך המקור וגם את התרגום?&lt;/li&gt;&lt;/ul&gt;
  &lt;/section&gt;

  &lt;section class=&quot;gov-panel&quot; id=&quot;panel-destination&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-destination&quot; hidden&gt;
    &lt;h2&gt;לאיזו מדינה המסמך מיועד?&lt;/h2&gt;
    &lt;div class=&quot;choice-grid&quot; role=&quot;tablist&quot; aria-label=&quot;סוג מדינת היעד&quot;&gt;
      &lt;button class=&quot;choice-box&quot; id=&quot;destination-treaty-choice&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;destination-treaty-info&quot; aria-selected=&quot;true&quot;&gt;&lt;span class=&quot;choice-title&quot;&gt;&lt;i data-lucide=&quot;badge-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מדינה החברה באמנת האג&lt;/span&gt;&lt;span&gt;יש לקבל אפוסטיל.&lt;/span&gt;&lt;/button&gt;
      &lt;button class=&quot;choice-box&quot; id=&quot;destination-other-choice&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;destination-other-info&quot; aria-selected=&quot;false&quot;&gt;&lt;span class=&quot;choice-title&quot;&gt;&lt;i data-lucide=&quot;landmark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מדינה שאינה חברה באמנת האג&lt;/span&gt;&lt;span&gt;נדרש הליך אימות אחר הכולל את משרד החוץ.&lt;/span&gt;&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;destination-info&quot; id=&quot;destination-treaty-info&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;destination-treaty-choice&quot;&gt;
      &lt;p&gt;&lt;a href=&quot;https://www.hcch.net/en/instruments/conventions/status-table/?cid=41&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;לרשימת המדינות החברות באמנת האג&lt;/a&gt;&lt;/p&gt;
      &lt;div class=&quot;notice&quot;&gt;&lt;h3&gt;קבלת אפוסטיל דיגיטלי&lt;/h3&gt;&lt;p&gt;מדינה שהאמנה חלה בינה לבין ישראל נדרשת לקבל אפוסטיל דיגיטלי תקף, ואינה יכולה לדחות אותו רק משום שהונפק באופן דיגיטלי. בדקו עם הגוף המקבל כיצד יש להגיש את הקובץ.&lt;/p&gt;&lt;/div&gt;
      &lt;aside class=&quot;payment-box&quot;&gt;&lt;h4&gt;אגרת אפוסטיל&lt;/h4&gt;&lt;p&gt;קבלת אפוסטיל כרוכה בתשלום של 41 ש״ח לכל תעודה. סכום האגרה מתעדכן מדי שנה ב־1 בינואר.&lt;/p&gt;&lt;/aside&gt;
      &lt;details class=&quot;guide-box&quot;&gt;&lt;summary&gt;נתקלת בקושי באפוסטיל הדיגיטלי?&lt;/summary&gt;&lt;div class=&quot;guide-box-content&quot;&gt;&lt;p&gt;אם נתקלת בקושי בהפקת אפוסטיל דיגיטלי או בהכרה בו, באפשרותך לפנות ליחידה לפניות הציבור במשרד המשפטים:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;טלפון:&lt;/strong&gt; &lt;a href=&quot;tel:0733927799&quot;&gt;073-3927799&lt;/a&gt;.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;שעות המענה:&lt;/strong&gt; בימים ראשון, שלישי וחמישי, בשעות 08:30–12:30.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;דואר אלקטרוני:&lt;/strong&gt; &lt;a href=&quot;mailto:pniyot@justice.gov.il&quot;&gt;pniyot@justice.gov.il&lt;/a&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
    &lt;div class=&quot;destination-info&quot; id=&quot;destination-other-info&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;destination-other-choice&quot; hidden&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;gov-panel&quot; id=&quot;panel-documents&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-documents&quot; hidden&gt;
    &lt;h2&gt;אימות מסמכים&lt;/h2&gt;
    &lt;details class=&quot;guide-box&quot; open&gt;
      &lt;summary&gt;בדיקת דרישות הגוף שאליו מיועד המסמך&lt;/summary&gt;
      &lt;div class=&quot;guide-box-content&quot;&gt;&lt;p&gt;בדקו בקפידה עם הגוף שאליו מיועד המסמך אם הוא מקבל מסמכים ואישורי אפוסטיל דיגיטליים, אם נדרש תרגום ואם יש לאמת גם את מסמך המקור וגם את התרגום.&lt;/p&gt;&lt;/div&gt;
    &lt;/details&gt;
    &lt;details class=&quot;guide-box&quot;&gt;
      &lt;summary&gt;הנפקת המסמך וקבלת אימות עבורו&lt;/summary&gt;
      &lt;div class=&quot;guide-box-content&quot;&gt;
    &lt;h3&gt;לאיזו מדינה מיועד המסמך?&lt;/h3&gt;
    &lt;div class=&quot;country-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;סוג מדינת היעד&quot;&gt;
      &lt;button class=&quot;country-tab&quot; id=&quot;country-treaty-tab&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;country-treaty-panel&quot; aria-selected=&quot;true&quot;&gt;אימות מסמך עבור מדינה החתומה על אמנת האג&lt;/button&gt;
      &lt;button class=&quot;country-tab&quot; id=&quot;country-other-tab&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-controls=&quot;country-other-panel&quot; aria-selected=&quot;false&quot;&gt;אימות מסמך עבור מדינה שאינה חתומה על אמנת האג&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;country-panel&quot; id=&quot;country-treaty-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;country-treaty-tab&quot;&gt;
    &lt;h3&gt;בחרו את סוג המסמך&lt;/h3&gt;
    &lt;p class=&quot;intro&quot;&gt;פתחו את שם המסמך כדי לראות כיצד משיגים אותו וכיצד מקבלים עבורו אפוסטיל. האפשרות הדיגיטלית מוצגת רק במסמכים שבהם היא זמינה.&lt;br&gt;תדפיס של קובץ דיגיטלי אינו מסמך מקור.&lt;/p&gt;

    &lt;section class=&quot;category&quot;&gt;&lt;h3&gt;מסמכים משפטיים – בתי משפט ובתי דין אזוריים לעבודה&lt;/h3&gt;&lt;p class=&quot;category-note&quot;&gt;האפוסטיל ניתן בידי הרשות השופטת. לפסקי דין ולהחלטות שיפוטיות ניתן לקבל גם אפוסטיל דיגיטלי.&lt;/p&gt;&lt;div class=&quot;docs&quot;&gt;
      &lt;details open&gt;&lt;summary&gt;פסקי דין והחלטות שיפוטיות&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מפיקים מסמך ציבורי מתיק בית המשפט או בית הדין האזורי לעבודה באמצעות מערכת נט המשפט, או מקבלים העתק נאמן למקור במזכירות.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;מגישים בנט המשפט בקשה לאפוסטיל עבור פסק דין או החלטה, משלמים אגרה ומקבלים תעודה דיגיטלית באזור האישי. התעודה נשמרת 3 חודשים, ולכן מומלץ לשמור את הקובץ.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מקבלים במזכירות העתק נאמן למקור וחתימת מורשה חתימה, ולאחר תשלום אגרה מקבלים אפוסטיל במזכירות בית משפט או בית דין אזורי לעבודה. מסמכי העליון, בית הדין הארצי ובתי משפט מקומיים מאומתים בערכאה אחרת.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;צווי ירושה וצווי קיום צוואה מבית המשפט&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מקבלים העתק נאמן למקור ממזכירות בית המשפט שנתן את הצו.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;אפוסטיל דיגיטלי אינו זמין לצו שהוצא בבית משפט. סריקה או תדפיס של הצו אינם נחשבים למסמך דיגיטלי מקורי.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;לאחר קבלת העתק נאמן למקור וחתימת מורשה במזכירות, מבקשים אפוסטיל של הרשות השופטת ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;פרוטוקולים של בתי משפט&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מבקשים ממזכירות הערכאה העתק נאמן למקור של הפרוטוקול.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;אפוסטיל דיגיטלי זמין לפסקי דין ולהחלטות שיפוטיות, ואינו זמין לפרוטוקולים.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מקבלים חתימת מורשה במזכירות ומגישים לאפוסטיל של הרשות השופטת בבית משפט או בבית דין אזורי לעבודה, בתשלום אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;&lt;/section&gt;

    &lt;section class=&quot;category&quot;&gt;&lt;h3&gt;מסמכים משפטיים – בתי דין דתיים ורשם הירושה&lt;/h3&gt;&lt;p class=&quot;category-note&quot;&gt;האימות הפיזי נעשה במשרד החוץ לאחר חתימת מורשה של הגוף המנפיק.&lt;/p&gt;&lt;div class=&quot;docs&quot;&gt;
      &lt;details&gt;&lt;summary&gt;פסקי דין של בתי דין דתיים&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מבקשים מבית הדין הרלוונטי – רבני, שרעי או אחר – מסמך מקור והנחיה לקבלת חתימת מורשה.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;לא צוין במסמך מסלול אפוסטיל דיגיטלי לפסקי דין של בתי דין דתיים.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מקבלים מסמך מקור וחתימת מורשה חתימה בגוף המנפיק, ואז מגישים למשרד החוץ בהגעה, בדואר או בשליחים ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;צווי ירושה וצווי קיום צוואה של הרשם לענייני ירושה&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מזמינים העתק דיגיטלי באתר הרשם לענייני ירושה; למסלול הפיזי מבקשים מסמך מקור וחתימת מורשה.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;מגישים את ההעתק הדיגיטלי בשירות האפוסטיל הדיגיטלי ומשלמים אגרה. שולחים לגורם הזר את הקובץ החתום, לא תדפיס.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;משיגים מסמך מקור וחתימת מורשה של הרשם, ואז מגישים למשרד החוץ בהגעה, בדואר או בשליחים ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;&lt;/section&gt;

    &lt;section class=&quot;category&quot;&gt;&lt;h3&gt;אישורים נוטריוניים&lt;/h3&gt;&lt;p class=&quot;category-note&quot;&gt;האפוסטיל מאמת את חתימת הנוטריון. אישור נוטריוני אלקטרוני מוגש לאפוסטיל דיגיטלי בידי הנוטריון בלבד.&lt;/p&gt;&lt;div class=&quot;docs&quot;&gt;
      &lt;details&gt;&lt;summary&gt;תרגום נוטריוני&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; פונים לנוטריון לקבלת תרגום נוטריוני. יש לברר אם מדינת היעד דורשת אימות גם למסמך המקורי וגם לתרגום; במצב כזה ייתכן שיידרשו שני אישורים.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;אם הנוטריון חתם אלקטרונית, הנוטריון עצמו מגיש את האישור באתר מחלקת רישוי נוטריונים. השירות אינו פתוח להגשה עצמית של הציבור.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מקבלים מהנוטריון מסמך מקורי, ומגישים לאפוסטיל של הרשות השופטת במזכירות בית משפט או בית דין אזורי לעבודה, בתשלום אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;אימות חתימה נוטריוני&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; החותם מתייצב בפני נוטריון ומקבל אישור אימות חתימה.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;באישור חתום אלקטרונית, הנוטריון מגיש את הבקשה בשירות הייעודי לנוטריונים.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מגישים את האישור הנוטריוני המקורי לאפוסטיל של הרשות השופטת ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;העתק נאמן למקור נוטריוני&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מציגים לנוטריון את מסמך המקור ומבקשים אישור שההעתק נאמן למקור.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;כאשר האישור נחתם אלקטרונית, ההגשה לאפוסטיל הדיגיטלי נעשית בידי הנוטריון בלבד.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מגישים את האישור הנוטריוני המקורי למזכירות בית משפט או בית דין אזורי לעבודה לקבלת אפוסטיל, בתשלום אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;תצהיר נוטריוני&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; חותמים ומאשרים את התצהיר בפני נוטריון.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;אם התצהיר אושר ונחתם אלקטרונית, הנוטריון מגישו בשירות האפוסטיל הדיגיטלי לנוטריונים.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;את התצהיר הנוטריוני המקורי מגישים לאפוסטיל של הרשות השופטת ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;&lt;/section&gt;

    &lt;section class=&quot;category&quot;&gt;&lt;h3&gt;מעמד אישי ורישום&lt;/h3&gt;&lt;p class=&quot;category-note&quot;&gt;לחלק מהתעודות ניתן לקבל אפוסטיל דיגיטלי. לקבלת אפוסטיל פיזי נדרשים מסמך מקור וחתימת מורשה של הגוף המנפיק.&lt;/p&gt;&lt;div class=&quot;docs&quot;&gt;
      &lt;details&gt;&lt;summary&gt;תעודת לידה&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מזמינים תעודה דו-לשונית בעברית ובאנגלית באזור האישי הממשלתי. השירות לבני משפחה מדרגה ראשונה, ללא עלות, והמסמך מתקבל בדרך כלל בתוך כ-48 שעות.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;בוחרים באפשרות אפוסטיל ומגישים את קובץ התעודה הדו-לשונית בשירות הדיגיטלי, משלמים אגרה ושולחים למדינת היעד את הקובץ החתום.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;משיגים תעודת מקור וחתימת מורשה חתימה של רשות האוכלוסין, ואז מגישים למשרד החוץ בהגעה, בדואר או בשליחים ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;תעודת פטירה&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; בן משפחה של המנוח מזמין תעודה באזור האישי הממשלתי.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;מגישים את הקובץ המקורי בשירות האפוסטיל הדיגיטלי ומשלמים אגרה; מעבירים למדינת היעד את הקובץ החתום.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מבקשים תעודת מקור וחתימת מורשה של רשות האוכלוסין, ומגישים למשרד החוץ בהגעה, בדואר או בשליחים, בתשלום אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;תעודת רווקות&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; מבקשים תעודה מהגוף המוסמך שהנפיק אותה ומבררים היכן מתקבלת חתימת מורשה.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;לא צוין במסמך מסלול אפוסטיל דיגיטלי לתעודת רווקות.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;מקבלים מסמך מקור וחתימת מורשה של הגוף המנפיק, ואז מגישים למשרד החוץ ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;
      &lt;details&gt;&lt;summary&gt;תמצית רישום&lt;/summary&gt;&lt;div class=&quot;doc-body&quot;&gt;&lt;p class=&quot;obtain&quot;&gt;&lt;span class=&quot;label&quot;&gt;איך משיגים:&lt;/span&gt; באזור האישי מחפשים „תמצית רישום מורחבת”. רק התמצית המורחבת זמינה במסלול הדיגיטלי.&lt;/p&gt;&lt;div class=&quot;paths&quot;&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;monitor&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול דיגיטלי&lt;/h4&gt;&lt;p&gt;בוחרים באפשרות אפוסטיל עבור תמצית רישום מורחבת, משלמים אגרה ומקבלים קובץ חתום.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;path&quot;&gt;&lt;h4&gt;&lt;i data-lucide=&quot;file-text&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;מסלול פיזי&lt;/h4&gt;&lt;p&gt;משיגים תמצית מקור וחתימת מורשה של רשות האוכלוסין, ואז מגישים למשרד החוץ ומשלמים אגרה.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;

    &lt;aside class=&quot;warning&quot;&gt;&lt;h3&gt;לא מצאתי את המסמך&lt;/h3&gt;&lt;p&gt;למסמך ציבורי שאינו מופיע בשירות האפוסטיל הדיגיטלי, יש להשיג מסמך מקור וחתימת מורשה של הגוף המנפיק, ככל שנדרשת, ולאחר מכן לפנות לקבלת אפוסטיל פיזי.&lt;/p&gt;&lt;/aside&gt;
    &lt;details class=&quot;guide-box physical-submission&quot;&gt;
      &lt;summary&gt;הגשת מסמך לאימות פיזי במשרד החוץ&lt;/summary&gt;
      &lt;div class=&quot;guide-box-content&quot;&gt;
        &lt;h4&gt;לפני ההגשה&lt;/h4&gt;
        &lt;p&gt;ודאו שבידיכם מסמך מקור הנושא את חתימת מורשה החתימה של הגוף המנפיק, ככל שנדרשת. צילום, סריקה או תדפיס של מסמך דיגיטלי אינם מסמך מקור.&lt;/p&gt;
        &lt;h4&gt;איך מגישים&lt;/h4&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;בהגעה למשרד החוץ:&lt;/strong&gt; שער הכניסה הראשי, שדרות יצחק רבין 9, ירושלים. קבלת קהל בימים ראשון, שני, שלישי וחמישי בשעות 09:00–12:30, וביום רביעי בשעות 09:00–11:30. אין צורך לתאם הגעה מראש.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;בדואר:&lt;/strong&gt; שולחים את מסמכי המקור לענף לאימות מסמכים ציבוריים באגף הקונסולרי, משרד החוץ, שדרות יצחק רבין 9, ירושלים. מצרפים אישור תשלום, פרטי התקשרות ופרטים מלאים להחזרת המסמכים.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;באמצעות שליחים:&lt;/strong&gt; ניתן למסור ולאסוף מסמכים באמצעות חברת שליחויות מטעם המבקש.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;h4&gt;פרטי קשר&lt;/h4&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;טלפון:&lt;/strong&gt; &lt;a href=&quot;tel:025303301&quot;&gt;02-5303301&lt;/a&gt;.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;שעות המענה הטלפוני:&lt;/strong&gt; בימים שני ושלישי בשעות 13:30–16:30, וביום חמישי בשעות 12:30–15:30.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;דואר אלקטרוני:&lt;/strong&gt; &lt;a href=&quot;mailto:apostille@mfa.gov.il&quot;&gt;apostille@mfa.gov.il&lt;/a&gt;.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p&gt;&lt;strong&gt;שימו לב:&lt;/strong&gt; האימות ניתן למסמך המקורי. אין להדפיס מסמך ואפוסטיל דיגיטליים לצורך הגשתם כאימות פיזי.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/details&gt;
    &lt;/div&gt;
    &lt;div class=&quot;country-panel&quot; id=&quot;country-other-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;country-other-tab&quot; hidden&gt;
      &lt;h3&gt;אימות מסמך למדינה שאינה חתומה על אמנת האג&lt;/h3&gt;
      &lt;p&gt;מסמך המיועד למדינה שאינה חתומה על האמנה אינו מקבל אפוסטיל. יש לקבל עליו חותמת אימות אחרת של משרד החוץ, ולאחר מכן אימות נוסף של נציגות מדינת היעד בישראל.&lt;/p&gt;
      &lt;h4&gt;שלבי האימות:&lt;/h4&gt;
      &lt;ol class=&quot;steps&quot;&gt;
        &lt;li&gt;&lt;strong&gt;מכינים את המסמך:&lt;/strong&gt; משיגים מסמך מקור ומקבלים חתימת מורשה חתימה של הגוף המנפיק. במסמך נוטריוני או במסמך של בית משפט נדרש האישור המקדים המתאים של הרשות השופטת.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;פונים למשרד החוץ:&lt;/strong&gt; מקבלים חותמת אימות שאינה אפוסטיל. אימות משרד החוץ אינו כרוך בתשלום אגרה.&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;פונים לנציגות מדינת היעד בישראל:&lt;/strong&gt; מקבלים את האימות הנוסף הנדרש. יש לברר עם הנציגות מראש את הדרישות, העלויות וזמני הטיפול שלה.&lt;/li&gt;
      &lt;/ol&gt;
      &lt;aside class=&quot;payment-box&quot;&gt;&lt;h4&gt;תשלום&lt;/h4&gt;&lt;p&gt;אימות המסמך במשרד החוץ אינו כרוך באגרה. ייתכן שנציגות מדינת היעד תגבה תשלום עבור האימות הנוסף.&lt;/p&gt;&lt;/aside&gt;
      &lt;details class=&quot;guide-box physical-submission&quot;&gt;
        &lt;summary&gt;פרטי קשר והגשה במשרד החוץ&lt;/summary&gt;
        &lt;div class=&quot;guide-box-content&quot;&gt;
          &lt;ul&gt;
            &lt;li&gt;&lt;strong&gt;טלפון:&lt;/strong&gt; &lt;a href=&quot;tel:025303301&quot;&gt;02-5303301&lt;/a&gt;.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;שעות המענה הטלפוני:&lt;/strong&gt; בימים שני ושלישי בשעות 13:30–16:30, וביום חמישי בשעות 12:30–15:30.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;דואר אלקטרוני:&lt;/strong&gt; &lt;a href=&quot;mailto:apostille@mfa.gov.il&quot;&gt;apostille@mfa.gov.il&lt;/a&gt;.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;כתובת:&lt;/strong&gt; שער הכניסה הראשי, משרד החוץ, שדרות יצחק רבין 9, ירושלים.&lt;/li&gt;
            &lt;li&gt;&lt;strong&gt;קבלת קהל:&lt;/strong&gt; בימים ראשון, שני, שלישי וחמישי בשעות 09:00–12:30, וביום רביעי בשעות 09:00–11:30. אין צורך לתאם הגעה מראש.&lt;/li&gt;
          &lt;/ul&gt;
          &lt;a class=&quot;route-link&quot; href=&quot;https://www.gov.il/he/pages/document_verification&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;למידע נוסף על אימות מסמכים במשרד החוץ&lt;/a&gt;
        &lt;/div&gt;
      &lt;/details&gt;
      &lt;aside class=&quot;warning&quot;&gt;&lt;h3&gt;שימו לב&lt;/h3&gt;&lt;p&gt;ללא אימות של נציגות מדינת היעד בישראל, המסמך לא יתקבל על ידי הרשויות באותה מדינה.&lt;/p&gt;&lt;/aside&gt;
    &lt;/div&gt;
      &lt;/div&gt;
    &lt;/details&gt;

          &#x27;&lt;li&gt;שלמו את אגרת האפוסטיל.&lt;/li&gt;&lt;/ol&gt;&#x27;;

      } else if (paths[1]) {
        const physicalParagraph = Array.from(paths[1].children).find((element) =&gt; element.tagName === &#x27;P&#x27;);

          const sentences = physicalParagraph.textContent.trim().split(/(?&lt;=[.!?])\s+/).filter(Boolean);

      if (paths[0] &amp;&amp; digitalLinks[title]) {

      }
      if (paths[1] &amp;&amp; judicialDocuments.has(title)) {
        paths[1].insertAdjacentHTML(&#x27;beforeend&#x27;, &#x27;&lt;a class=&quot;route-link&quot; href=&quot;https://www.gov.il/he/service/apostille-approval-for-countries&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;להגשת בקשה ברשות השופטת&lt;/a&gt;&#x27;);
      } else if (paths[1]) {
        paths[1].insertAdjacentHTML(&#x27;beforeend&#x27;, &#x27;&lt;a class=&quot;route-link&quot; href=&quot;https://www.gov.il/he/pages/document_verification&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;למידע על הגשה במשרד החוץ&lt;/a&gt;&#x27;);

        paths[0].remove();
      }
    });

    const detailsByTitle = new Map(
      Array.from(root.querySelectorAll(&#x27;#panel-documents .category details&#x27;)).map((item) =&gt; [item.querySelector(&#x27;summary&#x27;).textContent.trim(), item])
    );
    const groups = [
      [&#x27;לידה, נישואין ומעמד אישי&#x27;, [&#x27;תעודת לידה&#x27;,&#x27;תעודת פטירה&#x27;,&#x27;תעודת רווקות&#x27;,&#x27;תמצית רישום&#x27;,&#x27;תעודת נישואין&#x27;,&#x27;תעודת גירושין&#x27;]],
      [&#x27;בתי משפט וירושה&#x27;, [&#x27;פסקי דין והחלטות שיפוטיות&#x27;,&#x27;צווי ירושה וצווי קיום צוואה מבית המשפט&#x27;,&#x27;פרוטוקולים של בתי משפט&#x27;,&#x27;פסקי דין של בתי דין דתיים&#x27;,&#x27;צווי ירושה וצווי קיום צוואה של הרשם לענייני ירושה&#x27;]],
      [&#x27;מסמכים נוטריוניים&#x27;, [&#x27;תרגום נוטריוני&#x27;,&#x27;אימות חתימה נוטריוני&#x27;,&#x27;העתק נאמן למקור נוטריוני&#x27;,&#x27;תצהיר נוטריוני&#x27;]],
      [&#x27;לימודים והשכלה&#x27;, [&#x27;תעודת בגרות&#x27;,&#x27;תעודת טכנאי&#x27;,&#x27;תואר אקדמי&#x27;,&#x27;גיליון ציונים&#x27;]],
      [&#x27;מידע פלילי וצבאי&#x27;, [&#x27;תעודת מידע פלילי או תעבורתי (תעודת יושר)&#x27;,&#x27;תעודת שחרור מצה״ל&#x27;,&#x27;אישורי מילואים&#x27;]],
      [&#x27;בריאות ורישוי&#x27;, [&#x27;רישיון רפואי&#x27;,&#x27;תעודת מחלה רשמית&#x27;,&#x27;אישור חיסון&#x27;]],
      [&#x27;חברות, מקרקעין וקניין רוחני&#x27;, [&#x27;תעודת התאגדות חברה&#x27;,&#x27;תעודת שינוי שם חברה&#x27;,&#x27;תעודת רישום מאושרת של סימן מסחר&#x27;,&#x27;נסח סימן מסחר&#x27;,&#x27;מסמך בכורה של סימן מסחר&#x27;,&#x27;תעודה לפי תקנה 84&#x27;,&#x27;נסח רישום מקרקעין (טאבו)&#x27;,&#x27;אישור כניסה לתוקף של ייפוי כוח מתמשך&#x27;]]

    function renderDocumentDestination(destination) {

        const links = body.querySelector(&#x27;.doc-links&#x27;)?.outerHTML || &#x27;&#x27;;

        if (authority) {

        steps.push(&#x27;הגישו את המסמך למשרד החוץ לקבלת חותמת אימות שאינה אפוסטיל. אימות זה אינו כרוך באגרה.&#x27;);

      [&#x27;מסלול אימות אחר&#x27;, &#x27;הליך אימות אחר&#x27;],
      [&#x27;מסלול חתימת המורשה&#x27;, &#x27;אופן קבלת חתימת המורשה&#x27;],
      [&#x27;מסלול אפוסטיל דיגיטלי&#x27;, &#x27;אפשרות לקבלת אפוסטיל דיגיטלי&#x27;],

      [&#x27;במסלול הפיזי&#x27;, &#x27;באופן פיזי&#x27;],

      [&#x27;מסלול דיגיטלי&#x27;, &#x27;אפשרות דיגיטלית&#x27;],
      [&#x27;מסלול פיזי&#x27;, &#x27;אפשרות פיזית&#x27;]

    const textWalker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let textNode;
    while ((textNode = textWalker.nextNode())) {
      wordingChanges.forEach(([from, to]) =&gt; {
        textNode.nodeValue = textNode.nodeValue.replaceAll(from, to);

    tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; {
      tabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
      panels.forEach((panel) =&gt; { panel.hidden = panel.id !== tab.getAttribute(&#x27;aria-controls&#x27;); });

      countryTabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
      countryPanels.forEach((panel) =&gt; { panel.hidden = panel.id !== tab.getAttribute(&#x27;aria-controls&#x27;); });
    }));
  })();
